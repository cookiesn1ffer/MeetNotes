name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Tests
        run: uv run pytest -q

      - name: Smoke test (mocked STT + LLM)
        run: uv run pytest tests/test_smoke_pipeline.py -v
